# Deploys the web site to Cloudflare. Start it by hand, after the
# version is on npm: on the Actions page, or with
# `gh workflow run site.yml`.
#
# With no input, it makes the site from the tag of the version that
# npm has, so the site and npm are the same version.
#
# The environment `site` has the secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID.

name: Site

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'A tag or branch to make the site from. Empty: the tag of the version that npm has.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: site
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Find the tag
        id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF="v$(npm view ubqtest version)"
          fi
          echo "the site comes from $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - run: npm ci --ignore-scripts
      - run: npm run site
      # wrangler.jsonc names the Worker and the folder of the files.
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
