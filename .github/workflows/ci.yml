name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.runtime }} on ${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The runtime that runs the suite. Each job installs the three
        # runtimes: npm and the build need Node, and the suite has
        # tests that start each runtime.
        runtime: [node, bun, deno]
        node: [26]
        shell: [bash]
        # The jobs on Windows take the most time. The Node job there
        # has PowerShell, and the Bun and Deno jobs have bash, so each
        # shell runs on Windows.
        exclude:
          - { os: windows-latest, runtime: node, shell: bash }
        include:
          - { os: windows-latest, runtime: node, node: 26, shell: pwsh }
          # The newest Node: a change of Node shows here first.
          - { os: ubuntu-latest, runtime: node, node: latest, shell: bash }
          # A Node 24 from before 24.18: a `require` with no file
          # extension does not find a `.ts` file there, and the
          # CommonJS of the `transform` key has its own `require` for
          # that (D111).
          - { os: ubuntu-latest, runtime: node, node: 24.15.0, shell: bash }
          # The oldest Node that ubq runs on (D100).
          - { os: ubuntu-latest, runtime: node, node: 22.18.0, shell: bash }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      # The result is the same on each system. Each run of the suite
      # also checks the types of the project.
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'node' && matrix.node == 26
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # The Deno job runs the built runner. With a source map,
          # its coverage is coverage of src/.
          UBQ_SOURCEMAP: 1
      - uses: actions/cache@v6
        with:
          # The folder of the browser on Linux, macOS, and Windows.
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: browser-${{ runner.os }}-
      - name: Browser for the front-end tests
        run: node src/cli.ts browser install
      - name: Test on Node
        if: matrix.runtime == 'node'
        run: node src/cli.ts
      - name: Test on Bun
        if: matrix.runtime == 'bun'
        run: bun src/cli.ts
      # Deno runs the built runner. From the source, Deno 2.9 does not
      # load the parser of the counters (docs/07-status.md).
      - name: Test on Deno
        if: matrix.runtime == 'deno'
        run: deno run -A dist/cli.js
      # The store has the coverage of this runtime on this system.
      # The `coverage` job merges the stores of all jobs (D54).
      - name: Keep the run store
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: store-${{ matrix.runtime }}-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shell }}
          path: .ubq/runs.db*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # The VS Code extension, in a real VS Code. The extension starts
  # the server of the source (src/cli.ts).
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: vscode
      - run: npm run typecheck
        working-directory: vscode
      # VS Code needs a display.
      - run: xvfb-run -a npm test
        working-directory: vscode
      - run: npm run package -- --out ubq.vsix
        working-directory: vscode

  # Which code of ubq does no job run? One runtime on one system
  # cannot run each line: there is code for Bun, for Deno, and for
  # Windows. The job fails if no job ran a range of code.
  coverage:
    name: coverage of all jobs
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The comment of `ubq review` on a pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `ubq review` reads the base commit of a pull request.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: store-*
          path: stores
      - name: Merge the stores
        run: node src/cli.ts merge stores/*
      - name: Code that no job runs
        run: node src/cli.ts uncovered
      # The changes to the tests that a person must look at (D68),
      # with the merged coverage: an item says if the test runs code
      # that changed. The comment is one comment, changed on each
      # push. A pull request from a fork has a token that cannot
      # write a comment: there, the list is in the summary of the job.
      - name: Changes to the tests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set +e
          node src/cli.ts review --diff="origin/$BASE" > review.txt
          code=$?
          set -e
          cat review.txt
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          {
            echo '<!-- ubq review -->'
            echo '### Changes to the tests'
            echo
            echo "\`ubq review --diff=origin/$BASE\` lists the changes to the tests that a person must look at."
            echo
            echo '```text'
            cat review.txt
            echo '```'
          } > review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$FORK" = true ]; then exit 0; fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- ubq review -->")) | .id' | head -n 1)
          # No comment for a pull request with nothing to look at.
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@review.md > /dev/null
          elif [ "$code" = 1 ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@review.md > /dev/null
          fi
