name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.runtime }} on ${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The runtime that runs the suite. Each job installs the three
        # runtimes: npm and the build need Node, and the suite has
        # tests that start each runtime.
        runtime: [node, bun, deno]
        node: [24]
        shell: [bash]
        include:
          - { os: ubuntu-latest, runtime: node, node: latest, shell: bash }
          - { os: macos-latest, runtime: node, node: latest, shell: bash }
          - { os: windows-latest, runtime: node, node: 24, shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # The Deno job runs the built runner. With a source map,
          # its coverage is coverage of src/.
          UBQ_SOURCEMAP: 1
      - name: Browser for the front-end tests
        run: node src/cli.ts browser install
      - name: Test on Node
        if: matrix.runtime == 'node'
        run: node src/cli.ts
      - name: Test on Bun
        if: matrix.runtime == 'bun'
        run: bun src/cli.ts
      # Deno runs the built runner. From the source, Deno 2.9 does not
      # load the parser of the counters (docs/07-status.md).
      - name: Test on Deno
        if: matrix.runtime == 'deno'
        run: deno run -A dist/cli.js
      # The store has the coverage of this runtime on this system.
      # The `coverage` job merges the stores of all jobs (D54).
      - name: Keep the run store
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: store-${{ matrix.runtime }}-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shell }}
          path: .ubq/runs.db*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # Which code of ubq does no job run? One runtime on one system
  # cannot run each line: there is code for Bun, for Deno, and for
  # Windows. This job does not fail for the list yet: the suite has
  # gaps (docs/07-status.md).
  coverage:
    name: coverage of all jobs
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: store-*
          path: stores
      - name: Merge the stores
        run: node src/cli.ts merge stores/*
      - name: Code that no job runs
        run: node src/cli.ts uncovered || true
