# Publishes the VS Code extension (vscode/) to the Visual Studio
# Marketplace and to Open VSX when a v* tag is pushed, with the npm
# release (release.yml). The `version` script of package.json gives
# the extension the version of the package, in the commit of
# `npm version`. To publish again for a tag, start it by hand: on
# the Actions page, or with `gh workflow run vscode.yml --ref <tag>`.
# vscode/PUBLISH.md has the setup that a person must do first.
#
# Trusted publishing (OIDC) authenticates the job on both
# registries, so no token is stored. The trusted publisher entry on
# each registry names this repository, the workflow file
# `vscode.yml`, and the environment `vscode`.
#
# Open VSX accepts trusted publishing only for an extension that
# has a version. For the first version, put a token in the secret
# OVSX_PAT of the environment `vscode`. A token takes precedence
# over trusted publishing. Remove the secret after that run.

name: VS Code extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for the OIDC tokens of the registries

concurrency:
  group: vscode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: vscode
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false # no cache in release builds

      # The tag must name the version of the extension.
      - name: Check the tag
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "$GITHUB_REF_NAME is not the tag of vscode/package.json ($want)"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      # The tests run in the CI workflow.
      - run: npm run package -- --out ubq.vsix

      # The publish steps run only if the repository variable
      # VSCODE_PUBLISH is `true`: after the setup of vscode/PUBLISH.md.
      # With no variable, the workflow checks the package only.
      - name: Publish to the Visual Studio Marketplace
        if: vars.VSCODE_PUBLISH == 'true'
        run: npx vsce publish --oidc --packagePath ubq.vsix

      - name: Publish to Open VSX
        if: vars.VSCODE_PUBLISH == 'true'
        run: npx ovsx publish ubq.vsix --trusted-publishing
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
