# Stage an npm release when a v* tag is pushed, and then make a
# GitHub release for the tag. The same tag starts vscode.yml, which
# publishes the VS Code extension. Nothing reaches the registry
# until a maintainer approves the staged version on npmjs.com (or
# with `npm stage approve`), with 2FA.
#
# The notes of the GitHub release are the subject lines of the
# commits after the v* tag before this one.
#
# Trusted publishing (OIDC) authenticates the job, so no npm token
# is stored. On npmjs.com, the package's trusted publisher entry
# must name this repository, the workflow file `release.yml`, and
# the environment `npm`.
#
# After you approve the staged version, start the `Site` workflow
# (site.yml) by hand. It deploys the web site of the version that
# npm has.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # for the npm OIDC token
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # no cache in release builds

      # The tag must name the version in package.json.
      - name: Check the tag
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)"
            exit 1
          fi

      - run: npm ci --ignore-scripts
      # The `prepare` script of this package, which the line above
      # does not run: the link from the fixture projects to the
      # package. The type check of the fixtures needs it.
      - run: node test/setup.ts
      - run: npm run typecheck
      # The package is the `dist` folder, with its own package.json.
      # The tests run in the CI workflow. A maintainer approves the
      # staged version only if CI passed for the tagged commit.
      - run: npm run build

      - run: npm stage publish --access public
        working-directory: dist

  # A different job, so that the job with the npm token cannot
  # write to the repository, and this one has no npm token.
  release:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write # to make the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes need the history and the tags

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^")"
          # The commit that only sets the version is not a change.
          git log --reverse --format='- %s (%h)' \
            --invert-grep --grep='^[0-9]*\.[0-9]*\.[0-9]*$' \
            "$last..$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
