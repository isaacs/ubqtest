# Stage an npm release when a v* tag is pushed. Nothing reaches the
# registry until a maintainer approves the staged version on
# npmjs.com (or with `npm stage approve`), with 2FA.
#
# Trusted publishing (OIDC) authenticates the job, so no npm token
# is stored. On npmjs.com, the package's trusted publisher entry
# must name this repository, the workflow file `release.yml`, and
# the environment `npm`.
#
# After you approve the staged version, start the `Site` workflow
# (site.yml) by hand. It deploys the web site of the version that
# npm has.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # for the npm OIDC token

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # no cache in release builds

      # The tag must name the version in package.json.
      - name: Check the tag
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)"
            exit 1
          fi

      - run: npm ci --ignore-scripts
      # The `prepare` script of this package, which the line above
      # does not run: the link from the fixture projects to the package.
      - run: node test/setup.ts
      - run: npm run typecheck
      # The package is the `dist` folder, with its own package.json.
      - run: npm run build
      # The tests of Bun, of Deno, and of the browser skip here: this
      # job installs none of them. The CI workflow runs them.
      - run: npm test

      - run: npm stage publish --access public
        working-directory: dist
